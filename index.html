<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>etch-a-sketch</title>
</head>
<body>
    
    <div class="container">

        

    </div>
           
    <div class="buttonHolder">
    <button class="userButton">click me for new grid</button>
    </div>

   

    <script>
    const container = document.querySelector(".container");
    const button = document.querySelector(".userButton");

    function createGrid(size)
    {
    container.innerText = "";

    let containerSize = size * size;

    let percentageSize = (100 / size);

    for(let i = 0; i < containerSize; i++)
    {
        const divs = document.createElement("div");
        divs.classList.add("divHolder");

        divs.style.width = `${percentageSize}%`;
        container.appendChild(divs);
        
         divs.addEventListener("mouseover", e =>
    {
        divs.style.backgroundColor = "black";
    })

    }
    }

    button.addEventListener("click", e =>
    {
       let userInput = prompt("enter a number from 1 to 100.", "1");
       
       let returnValue = 0;

       if(userInput > 100 || userInput <= 0)
       {
         userInput = prompt("invalid number, enter a number from 1 to 100", "1");

         returnValue = parseInt(userInput);

         return createGrid(returnValue);
       }
       else return createGrid(parseInt(userInput));
    }
    )

    createGrid(16);



   
     


    
    </script>
</body>
</html>
